name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------ #
  # Lint (ruff check + ruff format)
  # Fast gate — runs on a single Python version; no package install needed.
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: ruff check
        run: ruff check trishul_snmp tests

      - name: ruff format --check
        run: ruff format --check trishul_snmp tests

  # ------------------------------------------------------------------ #
  # Type-check (mypy strict)
  # ------------------------------------------------------------------ #
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: pip install -e ".[dev,v3]"

      - name: mypy
        run: mypy

  # ------------------------------------------------------------------ #
  # Tests — matrix across all supported Python versions
  # ------------------------------------------------------------------ #
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev deps
        run: pip install -e ".[dev,v3]"

      - name: pytest
        run: |
          pytest \
            --tb=short \
            --cov=trishul_snmp \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=95 \
            -q

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ------------------------------------------------------------------ #
  # snmpd integration — runs tests/test_snmpd_integration.py against a
  # live net-snmp agent on 127.0.0.1:1161 (no systemd on runners; snmpd
  # daemonizes itself so it survives the runner killing each step's
  # process tree — do NOT use -f/& here).
  # ------------------------------------------------------------------ #
  snmpd:
    name: Test (snmpd)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: pip install -e ".[dev,v3]"

      - name: Install snmpd
        run: sudo apt-get update && sudo apt-get install -y snmpd

      - name: Start snmpd on 127.0.0.1:1161
        run: |
          printf 'rocommunity public 127.0.0.1\nagentaddress 127.0.0.1:1161\n' > /tmp/snmpd-test.conf
          sudo /usr/sbin/snmpd -C -c /tmp/snmpd-test.conf -p /tmp/snmpd-test.pid -Lf /tmp/snmpd-test.log

      - name: Wait for snmpd
        run: |
          for i in $(seq 1 50); do
            if .venv/bin/tsnmp get --host 127.0.0.1 --port 1161 --community public \
                --timeout 0.3 --retries 0 1.3.6.1.2.1.1.3.0 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.2
          done
          tail -n 20 /tmp/snmpd-test.log 2>/dev/null || true
          echo "snmpd never became reachable on 127.0.0.1:1161"
          exit 1

      - name: pytest (snmpd)
        run: pytest -m snmpd -q

      - name: Stop snmpd
        if: always()
        run: kill "$(cat /tmp/snmpd-test.pid)" 2>/dev/null || true
