name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------ #
  # All quality gates live in the reusable `quality` workflow, shared
  # with the release (tag) pipeline. This guarantees main/PR CI and the
  # tag path run byte-identical checks: ruff lint + format check, strict
  # mypy, pytest matrix (3.10-3.13) with >=95% coverage enforcement, and
  # the live-snmpd integration job.
  # ------------------------------------------------------------------ #
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml